name: klconsultancy release

# The klconsultancy fork's releases: an upstream release tag plus a few commits, each
# with an upstream pull request, tagged <upstream tag>-kl.N. A tag builds a multi-arch
# image, the Helm chart at <upstream chart version>-kl.N running that image, and a
# GitHub release naming both by digest.
# Not meant for upstream; this file is the only one of its kind in the fork.
on:
  push:
    tags:
      - '*-kl.*'

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART: ghcr.io/${{ github.repository_owner }}/charts/ext-postgres-operator

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the image on GHCR
      id-token: write # signing the attestation
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Dockerfile's builder stage runs per platform, so arm64 builds under QEMU.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # The chart at the upstream chart's version plus the tag's -kl.N, running the image
  # built above by digest.
  chart:
    needs: image
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      DIGEST: ${{ needs.image.outputs.digest }}
    permissions:
      contents: read
      packages: write # the chart on GHCR
      id-token: write # signing the attestation
      attestations: write
    outputs:
      version: ${{ steps.package.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        run: |
          curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          echo "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
      - id: package
        name: Package the chart
        run: |
          chart=charts/ext-postgres-operator
          version="$(yq .version "$chart/Chart.yaml")-${TAG##*-}"
          yq -i ".image.repository = \"$IMAGE\" | .image.tag = \"$TAG@$DIGEST\"" "$chart/values.yaml"
          helm lint --strict "$chart"
          helm lint --strict "$chart" --set rbac.clusterWide=false
          helm package "$chart" --version "$version" --app-version "$TAG" --destination dist
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - id: push
        name: Push the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          out=$(helm push "dist/ext-postgres-operator-$VERSION.tgz" "oci://${CHART%/*}")
          echo "$out"
          digest=$(sed -n 's/^Digest: //p' <<<"$out")
          [[ $digest == sha256:* ]] || { echo "no digest in helm push's output"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      # actions/attest pushes the attestation with Docker's credentials, not Helm's.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.CHART }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  release:
    needs: [image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
    steps:
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
          CHART_VERSION: ${{ needs.chart.outputs.version }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "$TAG" \
            --notes "Image: \`$IMAGE@$DIGEST\`

          Chart: \`oci://$CHART\` version \`$CHART_VERSION\` (\`$CHART@$CHART_DIGEST\`), which runs this image.

          Verify them with \`gh attestation verify oci://$IMAGE@$DIGEST --repo $GITHUB_REPOSITORY\` and \`gh attestation verify oci://$CHART@$CHART_DIGEST --repo $GITHUB_REPOSITORY\`.

          The commits on top of the upstream release are listed with \`git log\` from the upstream tag; each has an upstream pull request."
